<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <!--page-head-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Squiggle" />
    <meta property="og:locale" content="fr_FR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Verifies the Mastodon account: its profile links back to this page. -->
    <link rel="me" href="https://mastodon.social/@squigglefr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Squiggle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The reader's device, before the first paint, for a page that shows only that device's guide (src/pages/Favori.tsx). Same rule as phoneOs in src/phone.ts. -->
    <script>
      document.documentElement.dataset.device = /Android/i.test(navigator.userAgent)
        ? 'android'
        : /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
          ? 'ios'
          : 'ordinateur';
    </script>
    <!-- The app's script runs after the first paint: a browser install prompt fired before it is kept for src/install.ts. -->
    <script>
      addEventListener('beforeinstallprompt', (event) => { event.preventDefault(); window.earlyInstallPrompt = event; }, { once: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
